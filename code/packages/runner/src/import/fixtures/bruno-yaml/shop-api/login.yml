info:
  name: Login
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/oauth/token'
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: debug
        value: '1'
        disabled: true
  auth:
    type: apikey
    key: key
    value: '{{apiKey}}'
    placement: query
