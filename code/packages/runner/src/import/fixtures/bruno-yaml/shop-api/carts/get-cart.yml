info:
  name: Get cart
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/v1/carts/:cartId?expand=items'
  params:
    - name: expand
      value: items
      type: query
    - name: debug
      value: 'true'
      type: query
      disabled: true
    - name: cartId
      value: '{{cartId}}'
      type: path
  auth:
    type: none
